<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAMBUILD | Construction, Engineering & Infrastructure</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        /* --- DESIGN SYSTEM & CSS VARIABLES --- */
        :root {
            --bg-primary: #0a0b0d;
            --bg-secondary: #111317;
            --accent: #c5a880; /* Elegant Warm Gold/Bronze */
            --accent-muted: #2c2720;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --font-sans: 'Inter', sans-serif;
            --font-serif: 'Playfair Display', serif;
            --transition-smooth: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* --- CSS RESET & BASE STYLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: var(--font-sans);
            overflow-x: hidden;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* --- SCROLLBAR --- */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 3px;
        }

        /* --- GLOBAL LAYOUT & SCROLL INTERACTION TYPOGRAPHY --- */
        h1, h2, h3, .serif-font {
            font-family: var(--font-serif);
            font-weight: 400;
        }

        p {
            font-size: clamp(0.95rem, 1vw + 0.5rem, 1.1rem);
            color: var(--text-muted);
            font-weight: 300;
        }

        /* --- IMMERSIVE MOTIONS (SCROLL ANIMATION ENGINE) --- */
        .reveal {
            opacity: 0;
            transform: translateY(50px);
            transition: var(--transition-smooth);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        .parallax-wrapper {
            position: relative;
            overflow: hidden;
            height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-attachment: fixed;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }

        .parallax-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(10,11,13,0.7) 0%, rgba(10,11,13,0.95) 100%);
            z-index: 1;
        }

        /* --- STICKY NAVIGATION --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1.5rem 4%;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            background: rgba(10, 11, 13, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .logo {
            font-family: var(--font-serif);
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
        }

        .logo span {
            color: var(--accent);
        }

        nav {
            display: flex;
            gap: 2.5rem;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 500;
            transition: color 0.3s ease;
            position: relative;
            cursor: pointer;
        }

        nav a:hover, nav a.active-link {
            color: var(--accent);
        }

        .menu-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
        }

        .menu-toggle span {
            width: 25px;
            height: 2px;
            background-color: var(--text-main);
            transition: 0.3s;
        }

        /* --- MULTI-PAGE ARCHITECTURE (TAB SWITCHING) --- */
        .page-view {
            display: none;
            padding-top: 80px; /* offset header */
        }

        .page-view.active-view {
            display: block;
            animation: fadeInPage 0.8s ease forwards;
        }

        @keyframes fadeInPage {
            from { opacity: 0; transform: scale(0.99); }
            to { opacity: 1; transform: scale(1); }
        }

        /* --- BUTTONS --- */
        .btn {
            display: inline-flex;
            align-items: center;
            padding: 1rem 2rem;
            border: 1px solid var(--accent);
            color: var(--text-main);
            background: transparent;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: var(--transition-smooth);
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--accent);
            transition: var(--transition-smooth);
            z-index: -1;
        }

        .btn:hover::before {
            left: 0;
        }

        .btn:hover {
            color: var(--bg-primary);
        }

        /* --- HOME HERO SECTION --- */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            padding: 0 8%;
            position: relative;
            background: linear-gradient(rgba(10,11,13,0.5), rgba(10,11,13,0.9)), url('https://unsplash.com') center/cover no-repeat fixed;
        }

        .hero-content {
            max-width: 750px;
            z-index: 2;
        }

        .hero h1 {
            font-size: clamp(2.5rem, 5vw + 1rem, 5rem);
            line-height: 1.1;
            margin-bottom: 1.5rem;
        }

        .hero h1 em {
            font-family: var(--font-serif);
            font-style: italic;
            color: var(--accent);
        }

        /* --- GRIDS & STRUCTURE --- */
        .section-padding {
            padding: 8rem 8% 6rem 8%;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2.5rem;
        }

        .section-title {
            font-size: clamp(2rem, 3vw + 0.5rem, 3.5rem);
            margin-bottom: 3rem;
            position: relative;
        }

        .section-title span {
            display: block;
            font-size: 0.85rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 0.5rem;
            font-family: var(--font-sans);
        }

        /* --- COMPONENT STYLING: SERVICES & CARDS --- */
        .service-card {
            background: var(--bg-secondary);
            padding: 3rem 2rem;
            border: 1px solid rgba(255,255,255,0.02);
            transition: var(--transition-smooth);
            position: relative;
        }

        .service-card:hover {
            border-color: var(--accent);
            transform: translateY(-5px);
        }

        .service-card .num {
            font-family: var(--font-serif);
            font-size: 2rem;
            color: rgba(197, 168, 128, 0.2);
            margin-bottom: 1.5rem;
            display: block;
        }

        .service-card h3 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            letter-spacing: 0.5px;
        }

        /* --- COMPONENT STYLING: PORTFOLIO/PROJECTS --- */
        .project-card {
            position: relative;
            overflow: hidden;
            height: 450px;
            cursor: pointer;
        }

        .project-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .project-card:hover .project-img {
            transform: scale(1.1);
        }

        .project-meta {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 2.5rem;
            background: linear-gradient(360deg, rgba(10,11,13,0.95) 0%, rgba(10,11,13,0) 100%);
            z-index: 2;
        }

        /* --- COMPONENT STYLING: FORMS --- */
        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 1rem;
            background: var(--bg-secondary);
            border: 1px solid rgba(255,255,255,0.05);
            color: var(--text-main);
font-family: var(--font-sans);
font-size: 1rem;
transition: 0.3s;
}
input:focus, select:focus, textarea:focus {
outline: none;
border-color: var(--accent);
}
/* --- FOOTER --- */
footer {
background: #060708;
padding: 5rem 8% 3rem 8%;
border-top: 1px solid rgba(255,255,255,0.02);
}
/* --- RESPONSIVE DESIGN (MOBILE ADAPTATION) --- */
@media (max-width: 968px) {
.grid-2, .grid-3 {
grid-template-columns: 1fr;
gap: 2.5rem;
}
header {
padding: 1.2rem 6%;
}
nav {
display: none;
flex-direction: column;
position: absolute;
top: 100%;
left: 0;
width: 100%;
background: var(--bg-primary);
padding: 2rem 6%;
border-bottom: 1px solid rgba(255,255,255,0.05);
gap: 1.5rem;
}
nav.mobile-active {
display: flex;
}
.menu-toggle {
display: flex;
}
.parallax-wrapper {
background-attachment: scroll; /* Disables problematic mobile parallax quirks */
height: 40vh;
}
}

function switchPage(pageId) {
const views = document.querySelectorAll('.page-view');
views.forEach(view => view.classList.remove('active-view'));
const activeTarget = document.getElementById('page-' + pageId);
if(activeTarget) { activeTarget.classList.add('active-view'); }
const navItems = document.querySelectorAll('.nav-item');
navItems.forEach(item => {
item.classList.remove('active-link');
if(item.getAttribute('data-target') === pageId) { item.classList.add('active-link'); }
});
window.scrollTo({ top: 0, behavior: 'smooth' });
document.getElementById('nav-links').classList.remove('mobile-active');
}
const mobileMenu = document.getElementById('mobile-menu');
const navLinks = document.getElementById('nav-links');
mobileMenu.addEventListener('click', () => { navLinks.classList.toggle('mobile-active'); });
